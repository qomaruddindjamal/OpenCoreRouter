# Open Core Router — Lighttpd Web Server
# /etc/lighttpd/lighttpd.conf
#
# Serves the OCR Web UI (static ES modules) and PHP API backend
# All API calls are proxied to ocrd daemon on 127.0.0.1:8080

server.modules = (
    "mod_access",
    "mod_accesslog",
    "mod_alias",
    "mod_compress",
    "mod_redirect",
    "mod_fastcgi",
    "mod_proxy",
    "mod_rewrite",
    "mod_setenv",
)

# ── Server basics ──────────────────────────────────────────────────────────────
server.document-root        = "/www/ocr"
server.upload-dirs          = ( "/var/cache/lighttpd/uploads" )
server.errorlog             = "/var/log/lighttpd/error.log"
server.pid-file             = "/var/run/lighttpd.pid"
server.username             = "http"
server.groupname            = "http"
server.port                 = 80
server.tag                  = "OCR/1.0.1"
server.stat-cache-engine    = "simple"
server.max-connections      = 128
server.max-request-size     = 16384

# ── MIME types ─────────────────────────────────────────────────────────────────
mimetype.assign = (
    ".html"  => "text/html; charset=utf-8",
    ".css"   => "text/css; charset=utf-8",
    ".js"    => "application/javascript; charset=utf-8",
    ".mjs"   => "application/javascript; charset=utf-8",
    ".json"  => "application/json",
    ".png"   => "image/png",
    ".jpg"   => "image/jpeg",
    ".svg"   => "image/svg+xml",
    ".ico"   => "image/x-icon",
    ".woff2" => "font/woff2",
    ".gz"    => "application/x-gzip",
)

# ── Static file compression ────────────────────────────────────────────────────
compress.cache-dir           = "/var/cache/lighttpd/compress"
compress.filetype            = ("text/html", "text/css", "application/javascript")

# ── Access log ─────────────────────────────────────────────────────────────────
accesslog.filename           = "/var/log/lighttpd/access.log"

# ── Security headers ───────────────────────────────────────────────────────────
setenv.add-response-header = (
    "X-Content-Type-Options"    => "nosniff",
    "X-Frame-Options"           => "DENY",
    "X-XSS-Protection"          => "1; mode=block",
    "Referrer-Policy"           => "strict-origin-when-cross-origin",
    "Cache-Control"             => "no-store",
    "X-OCR-Version"             => "1.0.1",
)

# ── API v1 → ocrd Go daemon (port 8080) ────────────────────────────────────────
# /api/v1/* and /ws/* proxied to the Go daemon
$HTTP["url"] =~ "^/(api|ws)/" {
    proxy.server = ( "" => (( "host" => "127.0.0.1", "port" => 8080 )) )
    proxy.forwarded = ("for" => 1, "proto" => 1, "host" => 1)
}

# ── PHP API backend (legacy / additional endpoints) ────────────────────────────
$HTTP["url"] =~ "\.php$" {
    fastcgi.server = ( ".php" => ((
        "socket"                => "/var/run/php-fpm.sock",
        "broken-scriptfilename" => "enable",
    )))
}

# ── SPA fallback — serve index.html for all non-file routes ───────────────────
url.rewrite-if-not-file = ( "^(?!/api|/ws).*" => "/index.html" )

# ── Directory listing disabled ─────────────────────────────────────────────────
dir-listing.activate = "disable"

# ── Block dot-files ────────────────────────────────────────────────────────────
$HTTP["url"] =~ "/\." {
    url.access-deny = ("")
}

! Open Core Router — FRRouting Base Config
! /etc/frr/frr.conf
!
! OpenWrt 25.12.5 FRRouting — managed by OCR daemon via vtysh
! DO NOT edit manually — use OCR Web UI or API
!
frr version 9.1
frr defaults traditional
hostname Open-Core-Router
log syslog informational
no ipv6 forwarding
service integrated-vtysh-config
!
! ── Static routes (managed by OCR daemon) ─────────────────────────────────────
! ip route 0.0.0.0/0 <gateway>
!
! ── OSPF (disabled by default) ────────────────────────────────────────────────
! router ospf
!  ospf router-id 1.1.1.1
!  network 192.168.1.0/24 area 0
! !
!
! ── BGP (disabled by default) ─────────────────────────────────────────────────
! router bgp 65000
!  bgp router-id 1.1.1.1
!  no bgp ebgp-requires-policy
! !
!
line vty
!
end

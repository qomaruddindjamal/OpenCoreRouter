set default=0
set timeout=5
set gfxmode=auto

# ─── Open Core Router 1.0.1 ──────────────────────────────────────────────────
# Based on OpenWrt 25.12.5 — Linux 6.6.x — x86-64

insmod part_gpt
insmod part_msdos
insmod fat
insmod ext2
insmod gzio
insmod all_video

if loadfont unicode; then
  set gfxterm_font=unicode
fi
terminal_output gfxterm

# ── Color scheme ──────────────────────────────────────────────────────────────
set color_normal=cyan/black
set color_highlight=black/cyan
set menu_color_normal=cyan/black
set menu_color_highlight=black/light-cyan

# ── Background (if available) ─────────────────────────────────────────────────
# background_image /boot/grub/ocr-bg.png

echo ""
echo "    ___  _   _ ___ ___     ____  ___  _   _ _____ _____ ____"
echo "   / _ \| | | |_ _/ __|   |  _ \/ _ \| | | |_   _| ____|  _ \\"
echo "  | | | | |_| || | (__    | |_) | | | | | | | | | |  _| | |_) |"
echo "  | |_| |  _  || |\__ \   |  _ <| |_| | |_| | | | | |___| R  /"
echo "   \___/|_| |_|___||___/   |_| \_\\___/ \___/  |_| |_____|_|"
echo ""
echo "  Open Core Router 1.0.1  |  OpenWrt 25.12.5  |  x86-64"
echo "  https://github.com/qomaruddindjamal/OpenCoreRouter"
echo ""

# ── Menu entries ──────────────────────────────────────────────────────────────
menuentry "Open Core Router 1.0.1 (Normal Boot)" --class openwrt {
    set root=(hd0,gpt2)
    linux  /boot/vmlinuz root=/dev/sda2 rootfstype=ext4 rootwait \
           console=tty0 console=ttyS0,115200n8 \
           loglevel=4 \
           OCR_VERSION=1.0.1
    # initrd /boot/initrd
}

menuentry "Open Core Router 1.0.1 (Serial Console)" --class openwrt {
    set root=(hd0,gpt2)
    linux  /boot/vmlinuz root=/dev/sda2 rootfstype=ext4 rootwait \
           console=ttyS0,115200n8 \
           loglevel=4 \
           OCR_VERSION=1.0.1
}

menuentry "Open Core Router 1.0.1 (Recovery Mode)" --class openwrt {
    set root=(hd0,gpt2)
    linux  /boot/vmlinuz root=/dev/sda2 rootfstype=ext4 rootwait \
           console=tty0 console=ttyS0,115200n8 \
           OCR_RECOVERY=1 \
           init=/bin/sh
}

menuentry "Open Core Router 1.0.1 (Failsafe — Reset Config)" --class openwrt {
    set root=(hd0,gpt2)
    linux  /boot/vmlinuz root=/dev/sda2 rootfstype=ext4 rootwait \
           console=tty0 console=ttyS0,115200n8 \
           failsafe=true
}

menuentry "Boot from existing OS on disk" --class os {
    exit
}

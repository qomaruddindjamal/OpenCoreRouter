[package]
name = "asl-kernel-bin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
asl-kernel-core = { path = "../asl-kernel-core" }
asl-hal = { path = "../asl-hal" }
asl-sched = { path = "../asl-sched" }
asl-memory = { path = "../asl-memory" }
asl-afdx-ipc = { path = "../asl-afdx-ipc" }
asl-bootloader = { path = "../asl-bootloader" }
asl-router-fastpath = { path = "../../router/asl-router-fastpath" }
asl-router-tcam = { path = "../../router/asl-router-tcam" }
asl-router-pci = { path = "../../router/asl-router-pci" }
asl-router-drivers-virtio = { path = "../../router/asl-router-drivers-virtio" }
asl-router-netbuf = { path = "../../router/asl-router-netbuf" }
asl-router-netstack = { path = "../../router/asl-router-netstack" }
asl-router-webcore = { path = "../../router/asl-router-webcore" }
asl-router-api = { path = "../../router/asl-router-api" }
asl-router-webui = { path = "../../router/asl-router-webui" }
asl-router-hwinv = { path = "../../router/asl-router-hwinv" }
asl-router-lpm = { path = "../../router/asl-router-lpm" }
asl-router-nat = { path = "../../router/asl-router-nat" }
asl-router-drivers-virtio-blk = { path = "../../router/asl-router-drivers-virtio-blk" }
asl-router-drivers-ata = { path = "../../router/asl-router-drivers-ata" }
asl-router-gpt = { path = "../../router/asl-router-gpt" }
asl-router-persistence = { path = "../../router/asl-router-persistence" }
asl-router-installer = { path = "../../router/asl-router-installer" }

[lib]
crate-type = ["rlib"]

[features]
default = []
qemu-dev = []
poweroff-selftest = []

[[bin]]
name = "asl-kernel"
path = "src/main.rs"
test = false
bench = false


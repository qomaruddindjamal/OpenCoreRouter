[workspace]
resolver = "2"
members = [
    "asl-kernel/asl-kernel-core",
    "asl-kernel/asl-hal",
    "asl-kernel/asl-sched",
    "asl-kernel/asl-memory",
    "asl-kernel/asl-afdx-ipc",
    "asl-kernel/asl-bootloader",
    "asl-kernel/asl-kernel-bin",
    "router/asl-router-fastpath",
    "router/asl-router-tcam",
    "router/asl-router-gpon-ont",
    "router/asl-router-olt-carrier",
    "router/asl-router-qos",
    "router/asl-router-switching",
    "router/asl-router-security-vault",
    "router/asl-router-undi-npu",
    "router/asl-router-pci",
    "router/asl-router-netbuf",
    "router/asl-router-netstack",
    "router/asl-router-drivers-virtio",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["qomaruddindjamal <jamalpancur@gmail.com>", "Open Core Router Contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/qomaruddindjamal/OpenCoreRouter.git"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1

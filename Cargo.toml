[workspace]
resolver = "2"
members = [
    "opcr-kernel/opcr-core",
    "opcr-kernel/opcr-hal",
    "opcr-kernel/opcr-sched",
    "opcr-kernel/opcr-memory",
    "opcr-kernel/opcr-afdx-ipc",
    "opcr-kernel/opcr-bootloader",
    "opcr-kernel/opcr-kernel-bin",
    "opcr-modules/fastpath",
    "opcr-modules/tcam",
    "opcr-modules/gpon-ont",
    "opcr-modules/olt-carrier",
    "opcr-modules/qos",
    "opcr-modules/switching",
    "opcr-modules/security-vault",
    "opcr-modules/undi-npu",
]

[workspace.package]
version = "1.0.3"
edition = "2021"
authors = ["Open Core Router Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/qomaruddindjamal/OpenCoreRouter.git"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
